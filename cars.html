<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars | Velora Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <main>
        <section class="page-hero">
            <div class="container"><span class="section-kicker">OUR INVENTORY</span>
                <h1>Find your next car.</h1>
                <p>Search, filter and compare vehicles across our curated inventory.</p>
            </div>
        </section>
        <section class="section-padding pt-4">
            <div class="container">
                <div class="filter-card mb-4">
                    <form id="carFilterForm" class="row g-3">
                        <div class="col-lg-3"><label class="form-label">Search</label>
                            <div class="input-group"><span class="input-group-text"><i
                                        class="bi bi-search"></i></span><input id="searchInput" class="form-control"
                                    placeholder="Model, brand or keyword"></div>
                        </div>
                        <div class="col-md-3 col-lg-2"><label class="form-label">Brand</label><select id="brandFilter"
                                class="form-select">
                                <option value="">All Brands</option>
                            </select></div>
                        <div class="col-md-3 col-lg-2"><label class="form-label">Category</label><select
                                id="categoryFilter" class="form-select">
                                <option value="">All Categories</option>
                            </select></div>
                        <div class="col-md-3 col-lg-2"><label class="form-label">Fuel</label><select id="fuelFilter"
                                class="form-select">
                                <option value="">All Fuel Types</option>
                                <option>Petrol</option>
                                <option>Diesel</option>
                                <option>Electric</option>
                                <option>Hybrid</option>
                            </select></div>
                        <div class="col-md-3 col-lg-2"><label class="form-label">Sort</label><select id="sortFilter"
                                class="form-select">
                                <option value="featured">Featured</option>
                                <option value="low">Price: Low to High</option>
                                <option value="high">Price: High to Low</option>
                                <option value="name">Name A–Z</option>
                            </select></div>
                        <div class="col-lg-1 d-flex align-items-end"><button type="reset"
                                class="btn btn-outline-secondary w-100" title="Reset"><i
                                    class="bi bi-arrow-counterclockwise"></i></button></div>
                    </form>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p class="mb-0 text-muted" id="resultCount"></p><button class="btn btn-sm btn-outline-dark"
                        id="compareBtn" disabled><i class="bi bi-columns-gap"></i> Compare (<span
                            id="compareCount">0</span>)</button>
                </div>
                <div class="row g-4" id="carGrid"></div>
                <div id="emptyState" class="empty-state d-none"><i class="bi bi-car-front"></i>
                    <h4>No vehicles found</h4>
                    <p>Try changing your filters or search terms.</p>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <div id="testDriveMount"></div>
    <div id="toastMount"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cars.js"></script>
</body>

</html>
