<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Velora Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <div id="navbar"></div>
    <main class="auth-main">
        <div class="container">
            <div class="auth-card">
                <div class="auth-brand">
                    <div class="logo-mark">V</div>
                    <h2>Welcome back</h2>
                    <p>Sign in to access your account.</p>
                </div>
                <form id="loginForm"><label class="form-label">Email</label><input id="loginEmail" type="email"
                        class="form-control mb-3" required placeholder="admin@veloramotors.com"><label
                        class="form-label">Password</label>
                    <div class="input-group mb-3"><input id="loginPassword" type="password" class="form-control"
                            required placeholder="••••••••"><button type="button" class="btn btn-outline-secondary"
                            id="togglePassword"><i class="bi bi-eye"></i></button></div>
                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label
                                class="form-check-label" for="remember">Remember me</label></div><a href="#"
                            class="text-link">Forgot password?</a>
                    </div><button class="btn btn-primary w-100 btn-lg">Sign In</button>
                </form>
                <div class="demo-login mt-4"></div>
            </div>
        </div>
    </main>
    <div id="footer"></div>
    <div id="toastMount"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
